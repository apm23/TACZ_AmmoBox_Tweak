name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Validate JSON
        run: find src/main/resources -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
      - name: Verify ammo box recipes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('src/main/resources/data/tacz/recipe')
          cases = [
              ('iron_ammo_box.json', [' I ', 'ICI', ' I '], 'I', '#c:ingots/iron', 0),
              ('gold_ammo_box.json', [' G ', 'GCG', ' G '], 'G', '#c:ingots/gold', 1),
              ('diamond_ammo_box.json', [' D ', 'DCD', ' D '], 'D', '#c:gems/diamond', 2),
          ]
          for filename, pattern, material_key, material, level in cases:
              data = json.loads((base / filename).read_text())
              assert data['pattern'] == pattern, (filename, data['pattern'])
              assert data['key'][material_key] == material, (filename, data['key'])
              assert data['key']['C'] == 'minecraft:chest', (filename, data['key'])
              assert data['result']['id'] == 'tacz:ammo_box'
              assert data['result']['components']['minecraft:custom_data']['Level'] == level

          lv2 = json.loads(Path('src/main/resources/data/tacz_ammobox_tweak/recipe/diamond_ammo_box_level_2.json').read_text())
          assert lv2['pattern'] == ['NBN']
          assert lv2['key']['N'] == 'minecraft:netherite_ingot'
          box = lv2['key']['B']
          assert box['fabric:type'] == 'fabric:components'
          assert box['base'] == 'tacz:ammo_box'
          assert box['components']['minecraft:custom_data']['Level'] == 2
          assert lv2['result']['id'] == 'tacz:ammo_box'
          assert lv2['result']['components']['minecraft:custom_data']['Level'] == 3
          print('Recipe functional assertions passed.')
          PY
      - name: Build and unit tests
        run: gradle build --stacktrace
      - name: Server smoke
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          rm -f server-smoke.log
          set +e
          timeout 90s gradle runServer --console=plain 2>&1 | tee server-smoke.log
          rc=${PIPESTATUS[0]}
          set -e

          if ! grep -Eq 'Done \([^)]*\)!|Done \(' server-smoke.log; then
            echo 'Server never reached ready state.' >&2
            tail -n 200 server-smoke.log >&2
            exit 1
          fi

          if grep -Eqi 'mixin.*(failed|error)|exception in server tick loop|crash report' server-smoke.log; then
            echo 'Runtime/mixin error detected.' >&2
            tail -n 200 server-smoke.log >&2
            exit 1
          fi

          if grep -Fq "Couldn't parse data file 'tacz_ammobox_tweak:" server-smoke.log; then
            echo 'TACZ AmmoBox Tweak recipe/resource failed to parse.' >&2
            grep -F "Couldn't parse data file 'tacz_ammobox_tweak:" server-smoke.log >&2 || true
            exit 1
          fi

          echo 'Server reached ready state and addon resources parsed cleanly.'

          if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then
            echo "Unexpected runServer exit code: $rc" >&2
            exit $rc
          fi

      - name: Client smoke
        shell: bash
        run: |
          set -uo pipefail
          rm -f client-smoke.log
          set +e
          timeout 75s xvfb-run -a gradle runClient --console=plain 2>&1 | tee client-smoke.log
          rc=${PIPESTATUS[0]}
          set -e

          if grep -Eqi 'mixin.*(failed|error)|mixin apply failed|critical injection failure|crash report|exception in thread "main"' client-smoke.log; then
            echo 'Client mixin/runtime error detected.' >&2
            tail -n 250 client-smoke.log >&2
            exit 1
          fi

          if ! grep -Eq 'Loading Minecraft 26\.2|Setting user:' client-smoke.log; then
            echo 'Client did not reach Minecraft startup.' >&2
            tail -n 250 client-smoke.log >&2
            exit 1
          fi

          if ! grep -Fq 'tacz_ammobox_tweak 0.1.0' client-smoke.log; then
            echo 'Addon was not discovered in client runtime.' >&2
            tail -n 250 client-smoke.log >&2
            exit 1
          fi

          echo 'Client launched with TACZ and addon without mixin/runtime crash.'

          if [[ $rc -ne 0 && $rc -ne 124 && $rc -ne 143 ]]; then
            echo "Unexpected runClient exit code: $rc" >&2
            exit $rc
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tacz-ammobox-tweak
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            server-smoke.log
            client-smoke.log
