plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

// Compile against the exact TACZ Refabricated 26.2 R3 release used by this addon.
def taczJar = layout.buildDirectory.file('deps/TACZ-Refabricated-26.2-1.1.8+fabric.26.2.R3.jar')
def fetchTacz = tasks.register('fetchTacz') {
    outputs.file(taczJar)
    doLast {
        def out = taczJar.get().asFile
        out.parentFile.mkdirs()
        if (!out.exists()) {
            new URL('https://github.com/q14433686-arch/TaCZ_Refabricated_Unofficial/releases/download/26.2_R3/TACZ-Refabricated-26.2-1.1.8%2Bfabric.26.2.R3.jar').withInputStream { input ->
                out.withOutputStream { output -> output << input }
            }
        }
    }
}

configurations {
    taczCompile
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly files(taczJar)
}

tasks.withType(JavaCompile).configureEach {
    dependsOn(fetchTacz)
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
